services:
  db:
    image: postgres:15
    container_name: redmane-db
    restart: always
    environment:
      POSTGRES_DB: readmedatabase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./REDMANE_fastapi/data/REDMANE_fastapi_public_data:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - redmane-network

  backend:
    build:
      context: ./
      dockerfile: ./redmane_fastapi.dockerfile
    ports:
      - "8888:8888"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/readmedatabase
      DB_NAME: readmedatabase
      DB_USER: postgres
      DB_PASSWORD: password
      DB_HOST: db
      DB_PORT: 5432
      AUTH0_DOMAIN: dev-6mdq3tdvjb04tojd.us.auth0.com
      AUTH0_AUDIENCE: raZrj2RJz28jARpFHF3YzSVBB7sqGEvV
      AUTH0_ISSUER: https://dev-6mdq3tdvjb04tojd.us.auth0.com/
    depends_on:
      - db
    networks:
      - redmane-network

  frontend-build:
    build:
      context: ./
      dockerfile: ./redmane_reactjs.dockerfile
    volumes:
      - frontend-static:/static
    restart: "no"

  https-portal:
    image: steveltn/https-portal:1
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAINS: 'localhost'
      # changed this 
      # Do not use production until ready because Let's Encrypt has rate limits
      STAGE: 'local' # local, 'staging', 'production'
    volumes:
      - https-portal-data:/var/lib/https-portal
      #changed this 
      # - ./data-registry.wehi-rcp.cloud.edu.au.conf.erb:/var/lib/nginx-conf/data-registry.wehi-rcp.cloud.edu.au.ssl.conf.erb:ro
      - ./data-registry.wehi-rcp.cloud.edu.au.conf.erb:/var/lib/nginx-conf/localhost.ssl.conf.erb:ro
      - frontend-static:/var/www/vhosts/data-registry:ro
    depends_on:
      - backend
      - frontend-build
    networks:
      - redmane-network

volumes:
  postgres_data:
  https-portal-data:
  frontend-static:


networks:
  redmane-network:
    driver: bridge
