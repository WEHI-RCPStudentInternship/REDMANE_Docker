services:
  db:
    image: postgres:15
    container_name: redmane-db
    restart: always
    environment:
      POSTGRES_DB: readmedatabase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./REDMANE_fastapi/data/REDMANE_fastapi_public_data:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - redmane-network

  keycloak:
    image: quay.io/keycloak/keycloak:19.0
    container_name: redmane-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8080:8080"
    networks:
      - redmane-network

  keycloak-setup:
    image: quay.io/keycloak/keycloak:19.0
    container_name: redmane-keycloak-setup
    depends_on:
      - keycloak
    restart: on-failure
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - |
        echo 'Waiting for Keycloak...'
        sleep 20
        /opt/keycloak/bin/kcadm.sh config credentials --server http://keycloak:8080 --realm master --user admin --password admin
        /opt/keycloak/bin/kcadm.sh update realms/master -s sslRequired=NONE
        /opt/keycloak/bin/kcadm.sh create realms -s realm=redmane -s enabled=true -s sslRequired=NONE || true
        /opt/keycloak/bin/kcadm.sh update realms/redmane -s sslRequired=NONE
        /opt/keycloak/bin/kcadm.sh create clients -r redmane -s clientId=redmane -s enabled=true -s publicClient=true -s 'redirectUris=["http://localhost:5173/*"]' -s 'webOrigins=["http://localhost:5173"]' -s 'attributes={"post.logout.redirect.uris":"http://localhost:5173/*"}' || true
        CLIENT_ID=$(/opt/keycloak/bin/kcadm.sh get clients -r redmane --fields id,clientId | grep -B1 '"redmane"' | grep id | cut -d'"' -f4)
        /opt/keycloak/bin/kcadm.sh update clients/$CLIENT_ID -r redmane -s 'attributes={"post.logout.redirect.uris":"http://localhost:5173/*"}'
        /opt/keycloak/bin/kcadm.sh create users -r redmane -s username=student -s enabled=true -s emailVerified=true || true
        /opt/keycloak/bin/kcadm.sh set-password -r redmane --username student --new-password password --temporary=false || true
        /opt/keycloak/bin/kcadm.sh create clients -r redmane -s clientId=redmane -s enabled=true -s publicClient=true -s 'redirectUris=["http://localhost:5173/*"]' -s 'webOrigins=["http://localhost:5173"]' -s rootUrl="http://localhost:5173" -s baseUrl="http://localhost:5173" -s adminUrl="http://localhost:5173" -s 'attributes={"post.logout.redirect.uris":"http://localhost:5173/*"}' || true &&
        echo 'Setup complete'
    networks:
      - redmane-network

  backend:
    build:
      context: ./
      dockerfile: ./redmane_fastapi.dockerfile
    ports:
      - "8888:8888"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/readmedatabase
      DB_NAME: readmedatabase
      DB_USER: postgres
      DB_PASSWORD: password
      DB_HOST: db
      DB_PORT: 5432
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_ISSUER: ${AUTH0_ISSUER}
    depends_on:
      - db
    networks:
      - redmane-network

  frontend-build:
    build:
      context: ./
      dockerfile: ./redmane_reactjs.dockerfile
    volumes:
      - frontend-static:/static
    restart: "no"

  https-portal:
    image: steveltn/https-portal:1
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAINS: '${DOMAIN}'
      # changed this 
      # Do not use production until ready because Let's Encrypt has rate limits
      STAGE: '${STAGE}' # local, 'staging', 'production'
    volumes:
      - https-portal-data:/var/lib/https-portal
      #changed this 
      - ./${DOMAIN}.conf.erb:/var/lib/nginx-conf/${DOMAIN}.ssl.conf.erb:ro
      # - ./data-registry.wehi-rcp.cloud.edu.au.conf.erb:/var/lib/nginx-conf/data-registry.wehi-rcp.cloud.edu.au.ssl.conf.erb:ro
      # - ./data-registry.wehi-rcp.cloud.edu.au.conf.erb:/var/lib/nginx-conf/localhost.ssl.conf.erb:ro
      - frontend-static:/var/www/vhosts/data-registry:ro
    depends_on:
      - backend
      - frontend-build
    networks:
      - redmane-network

volumes:
  postgres_data:
  https-portal-data:
  frontend-static:
  keycloak_data:


networks:
  redmane-network:
    driver: bridge
